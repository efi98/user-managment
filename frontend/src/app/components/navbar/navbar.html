<nav class="navbar">
    <div class="navbar-brand">
        <button class="text" (click)="navigate('/')">
            <b i18n="@@navbarBrand">User Management App</b>
        </button>
        @if (isLoggedIn()) {
            <span>&nbsp;|&nbsp;{{ getTitleName() }}</span>
        }
    </div>

    <ul class="navbar-links">
        @if (isLoggedIn()) {
            <li>
                <button (click)="navigate('/')">
                    <span i18n="@@navbarHome">Home</span>
                </button>
            </li>
            @if (isAdmin()) {
                <li>
                    <button (click)="navigate('/admin-panel')">
                        <span i18n="@@navbarAdminPanel">Admin Panel</span>
                    </button>
                </li>
            }
            <li class="user-dropdown-wrapper" style="position: relative;">
                <button type="button" class="user-button" (click)="toggleUserDropdown()">
                    @if (currentUser()?.avatar) {
                        <span class="avatar-small">
                            <img [src]="getAvatarUrl(currentUser()?.avatar)" [alt]="selectedDisplayName()">
                        </span>
                    }
                    {{ selectedDisplayName() }} &#x25BC;
                </button>
                @if (showUserDropdown) {
                    <ul class="user-dropdown-menu">
                        <li>
                            <button type="button" class="text" (click)="goToSettings()">
                                <span i18n="@@navbarSettings">Settings</span>
                            </button>
                        </li>
                        <li>
                            <button type="button" class="text" (click)="logout()">
                                <span i18n="@@navbarLogout">Logout</span>
                            </button>
                        </li>
                    </ul>
                }
            </li>
        }
    </ul>
</nav>
@if (isServerDown()) {
    <div class="error-message">{{ errorMessage }}</div>
}
